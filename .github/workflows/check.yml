# The repository's own check, one job named `check`, a status on every pull request and on main;
# required in the main ruleset once it has run (cocoon-ai's docs/new-repository.md, step 5):
# the lint (tests/lint.sh: ShellCheck with .shellcheckrc over every script here, plus our own
# classes as greps) and the structure (tests/structure.sh: the README's sections and links, the
# documents the layout names, the owner file, no conflict markers). Nothing runs from the pull
# request but these two scripts, which the lint reads first.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/lint.sh
      - run: bash tests/structure.sh
